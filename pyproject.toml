[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maham"
version = "0.0.1.dev0"
description = "Community-developed scientific toolkit for astroparticle, high-energy, astronomy, and multimessenger research."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Project MAHAM"}]
keywords = ["astroparticle physics", "high-energy astrophysics", "astronomy", "multimessenger", "neutrinos", "cosmic rays", "gamma rays"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "astropy>=5.3"]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7"]
data = ["pandas>=2.0"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/Project-MAHAM"
Repository = "https://github.com/Project-MAHAM/maham"
Issues = "https://github.com/Project-MAHAM/maham/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
